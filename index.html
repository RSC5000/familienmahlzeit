<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Familienmahlzeit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
/* Layout: fester Kopf mit Wochennavigation, Wochenraster (Liste am iPhone, 7 Spalten ab 900px), Tableiste unten, Details als Bottom-Sheets */
:root{
  --bg:#FBF7F2; --card:#FFFFFF; --sunk:#F3ECE3; --fg:#3A3330; --muted:#857A72; --line:#EAE1D6;
  --accent:#F2A97E; --accent-soft:#FCE7D9; --accent-ink:#6E3515; --on-accent:#3A1E0E; --on-pastel:#3A3330; --plate:#FFFFFF; --decline:#8E2B3A;
  --good:#4F9461; --warn:#B87D1F; --bad:#C2605A; --on-bad:#FFFFFF;
  --shadow:0 1px 2px rgba(58,51,48,.06),0 4px 14px rgba(58,51,48,.06);
  --scrim:rgba(46,34,28,.38);
  --display:"Bricolage Grotesque", ui-rounded, -apple-system, system-ui, sans-serif;
  --body:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E1A18; --card:#2A2521; --sunk:#24201D; --fg:#F2EAE3; --muted:#A99D94; --line:#3B342F;
  --accent:#EFA27A; --accent-soft:#4A3123; --accent-ink:#FFD9C2; --on-accent:#2A140A; --plate:#46403B; --decline:#E07A8A;
  --good:#8CC79A; --warn:#E5B35A; --bad:#E58C83; --on-bad:#2A1210;
  --shadow:0 1px 2px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.55); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1E1A18; --card:#2A2521; --sunk:#24201D; --fg:#F2EAE3; --muted:#A99D94; --line:#3B342F;
  --accent:#EFA27A; --accent-soft:#4A3123; --accent-ink:#FFD9C2; --on-accent:#2A140A; --plate:#46403B; --decline:#E07A8A;
  --good:#8CC79A; --warn:#E5B35A; --bad:#E58C83; --on-bad:#2A1210;
  --shadow:0 1px 2px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.55); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto}
main.gutter{padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}

/* Kopf */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 6px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em;min-width:0}
.logo{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.me{display:flex;align-items:center;gap:6px;padding:3px 12px 3px 3px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:600;font-size:14px;flex:none}
.weeknav{display:flex;align-items:center;gap:6px;padding-block:2px 10px}
.wk{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kw{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1}
.range{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--sunk)}
.icon-btn.sm{width:30px;height:30px;border-radius:9px}
.icon-btn.sm svg.i{width:16px;height:16px}
.pill{padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:13px}
.page-title{font-family:var(--display);font-weight:700;font-size:24px;margin:0}

/* Hinweise */
.hints{background:var(--accent-soft);color:var(--accent-ink);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;display:grid;gap:2px;font-size:14px}
.hints p{margin:0}

/* Woche */
.week{display:grid;gap:10px}
.day{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;cursor:pointer;border:1.5px solid transparent;position:relative}
.day.today{border-color:var(--accent)}
.day.past{background:var(--sunk);box-shadow:none}
.day.past .slot{opacity:.72}
.day-main>.slot:empty{display:none}
.th.plate-empty{background:transparent;box-shadow:none;border:1.5px dashed var(--line)}
.th.surprise-plate{background:var(--accent-soft)}
.th.surprise-plate svg.i{color:var(--accent-ink);width:16px;height:16px}
.dish .surprise{color:var(--accent-ink);font-weight:700}
.day-date{display:flex;flex-direction:column;align-items:center;gap:0}
.dow{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.dnum{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05}
.today .dow{color:var(--accent-ink)}
.today-flag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:1px 6px;margin-top:4px}
.day-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.meta{display:flex;flex-wrap:nowrap;gap:8px;align-items:center;white-space:nowrap}
.kind{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kind svg.i{width:15px;height:15px}
.kind.k-surprise{color:var(--accent-ink)}
.psum{font-size:12.5px;color:var(--muted)}
.psum b{color:var(--fg);font-weight:700}
.foot.guests{border-top:1px solid var(--line);padding-top:8px;margin-top:auto}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--sunk);font-size:12px;font-weight:600}
.past .tag{background:var(--card)}
.tag svg.i{width:14px;height:14px}
.tag.out{background:var(--accent-soft);color:var(--accent-ink)}
.time{display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px}
.time svg.i{width:14px;height:14px;color:var(--muted)}
.cook{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;min-width:0}
.cook small{color:var(--muted);font-weight:500}
.muted{color:var(--muted);font-weight:500}
.dot{--c:var(--line);width:22px;height:28px;display:inline-block;flex:none}
.dot.lg{width:32px;height:41px}
.fig{width:100%;height:100%;display:block;overflow:visible}
.fig .h,.fig .b{fill:var(--c);stroke:var(--c);stroke-width:1.5;stroke-linejoin:round}
.fig text{fill:var(--on-pastel);font-family:var(--body);font-size:11.5px;font-weight:800;text-anchor:middle}
.fig .hr{fill:color-mix(in srgb,var(--c) 58%,#3A3330);stroke:none}
.dot.ghost .fig .h,.dot.ghost .fig .b{fill:none;stroke:var(--muted);stroke-dasharray:2.5 2}
.pdot.s-open .fig .hr,.pdot.s-no .fig .hr{fill:none;stroke:var(--c);stroke-width:1.5;stroke-dasharray:2.5 2}
.pdot.s-no .fig .hr{stroke:var(--line);stroke-dasharray:none}
.dish{display:flex;gap:8px;align-items:center;min-width:0}
.dish-t{min-width:0;display:flex;flex-direction:column}
.dish-t b{font-weight:600;line-height:1.25;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.dish.ph{color:var(--muted);font-size:13.5px}
.dish.surprise{color:var(--accent-ink);font-weight:700}
.dessert{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;padding-left:12px}
.dessert svg.i{width:14px;height:14px}
/* Teller: Speise rund, mit hellem Tellerrand und feiner Kante */
.th{--t:#EEDFCB;width:42px;height:42px;border-radius:50%;background:var(--t);color:var(--on-pastel);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;flex:none;overflow:hidden;box-shadow:0 0 0 3.5px var(--plate),0 0 0 4.5px var(--line);margin:5px}
.th.sm{width:30px;height:30px;font-size:13px;box-shadow:0 0 0 3px var(--plate),0 0 0 4px var(--line);margin:4px}
.th.xs{width:14px;height:14px;box-shadow:0 0 0 2.5px var(--plate),0 0 0 3.5px var(--line);margin:4px}
.th.lg{width:92px;height:92px;font-size:36px;box-shadow:0 0 0 8px var(--plate),0 0 0 9px var(--line);margin:9px}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th svg.i{color:var(--on-pastel)}
.grade{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.grade.good{color:var(--good)}.grade.mid{color:var(--warn)}.grade.low{color:var(--bad)}
.part{display:flex;flex-wrap:wrap;gap:6px 6px;align-items:flex-start}
.part.timed{padding-bottom:15px}
.pdot{--c:var(--line);position:relative;width:32px;height:40px;padding:2px 3px;border-radius:9px;display:block;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;flex:none}
.pdot.s-open .fig .h,.pdot.s-open .fig .b{fill:none;stroke-dasharray:2.5 2}
.pdot.s-open .fig text{fill:var(--fg)}
.pdot.s-no .fig .h,.pdot.s-no .fig .b{fill:none;stroke:var(--line)}
.pdot.s-no .fig text{fill:var(--muted)}
.pdot.s-no::after{content:"";position:absolute;left:3px;right:3px;top:50%;height:2px;margin-top:-1px;background:var(--decline);transform:rotate(-55deg);border-radius:2px}
.pdot.mine{background:var(--accent-soft);box-shadow:0 0 0 1.5px var(--accent)}
.past .pdot.mine{background:none;box-shadow:none}
.pdot i{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-style:normal;font-size:10.5px;font-weight:700;color:var(--fg);margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:13px}
.foot .lbl{color:var(--muted);font-weight:600}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--sunk);border-radius:999px;padding:2px}
.stepper button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;line-height:1}
.stepper button:hover:not(:disabled){background:var(--card)}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper b{min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-size:12px;font-weight:700}
.badge svg.i{width:14px;height:14px}
.badge.warn{background:transparent;border:1.5px solid var(--warn);color:var(--fg)}
.empty-note{margin:0;color:var(--muted);font-size:13.5px}
.week-foot{margin-top:18px;display:grid;gap:8px;justify-items:start}
.tip{margin:0;color:var(--muted);font-size:13px;max-width:60ch}
@media (min-width:640px) and (max-width:899px){
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:900px){
  /* 7 Spalten; jede Karte nutzt die gemeinsamen Zeilen (subgrid), damit Gleiches auf gleicher Höhe steht */
  .week{grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(10,auto);gap:0 8px}
  .day{grid-row:span 10;grid-template-rows:subgrid;grid-template-columns:minmax(0,1fr);row-gap:8px;padding:10px}
  .day-main{display:contents}
  .day-main>.slot:empty{display:block}
  .day-date{flex-direction:row;align-items:baseline;gap:6px;flex-wrap:wrap}
  .dnum{font-size:22px}
  .today-flag{margin-top:0}
  .meta{gap:6px}
  .meta .tag svg.i,.meta .time svg.i{display:none}
  .foot.guests{margin-top:0}
}

/* Tableiste */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.tabs button{flex:1;max-width:170px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 7px;font-size:11.5px;font-weight:700;color:var(--muted)}
.tabs .tic{display:grid;place-items:center;padding:3px 16px;border-radius:999px}
.tabs button[aria-current="page"]{color:var(--accent-ink)}
.tabs button[aria-current="page"] .tic{background:var(--accent-soft)}
.tabs .cnt{position:absolute;margin:-6px 0 0 26px;background:var(--accent);color:var(--on-accent);font-size:10px;border-radius:999px;padding:0 5px;line-height:16px}

/* Sheets */
.sheet-wrap{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;background:var(--bg);width:100%;max-height:calc(100% - 28px - env(safe-area-inset-top,0px));border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.18);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(20px)}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-head h2{flex:1;margin:0;font-family:var(--display);font-size:20px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:20px;align-content:start}
@media (min-width:700px){.sheet-wrap{align-items:center;padding:24px}.sheet{width:min(660px,100%);border-radius:20px;max-height:100%}.sheet-body{padding-bottom:24px}}

/* Formular */
.field{display:grid;gap:8px;min-width:0}
.flabel,.field>label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap;justify-self:start;max-width:100%}
.seg button{padding:7px 13px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.seg.sm button{padding:5px 9px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:500;font-size:14px}
.chip svg.i{width:16px;height:16px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.chip .dot{width:16px;height:21px;margin-left:-4px}
.figs{display:flex;gap:8px;flex-wrap:wrap}
.figs .sw{min-width:92px}
.chip.add{border-style:dashed;color:var(--muted)}
.xbtn{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;margin-right:-6px;color:var(--muted)}
.xbtn svg.i{width:14px;height:14px}
.inp{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);min-width:0}
.inp:focus{outline:none;border-color:var(--accent)}
input[type=time].inp,input[type=date].inp{width:auto;font-variant-numeric:tabular-nums}
.inp.sm{padding:5px 8px;font-size:13.5px;border-radius:9px}
textarea.inp{resize:vertical}
textarea.mono{font-family:var(--mono);font-size:12px;min-height:200px;white-space:pre}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700;justify-self:start}
.btn.ghost{background:var(--card);color:var(--fg);border:1.5px solid var(--line);font-weight:600}
.btn.danger{background:var(--bad);color:var(--on-bad)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.wide{justify-self:stretch}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.help{margin:0;color:var(--muted);font-size:13px}
.note{margin:0;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px}
.card{background:var(--card);border-radius:var(--r);padding:10px 12px}
.pickbtn{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);width:100%}
.pickbtn>svg.i{color:var(--muted)}
.plist{display:grid;gap:10px}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pname{flex:1;min-width:90px;font-weight:600}
.ptime{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.switch{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.switch span{width:42px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.switch.on span{background:var(--accent)}
.switch.on span::after{transform:translateX(16px)}

/* Einkauf */
.shop{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.shop li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 10px;background:var(--card);border-radius:12px;padding:8px 10px}
.shop li .claim{grid-column:2;grid-row:2;justify-self:start}
.shop li .icon-btn{grid-column:3;grid-row:1}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--card)}
.check svg.i{width:16px;height:16px;stroke-width:2.6}
.shop li.done .check{background:var(--good);border-color:var(--good)}
.shop li.done .stxt{text-decoration:line-through;color:var(--muted)}
.stxt{min-width:0;overflow-wrap:anywhere}
.claim{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px 3px 8px;border-radius:999px;background:var(--sunk);font-weight:600}
.claim.open{padding:4px 10px;color:var(--accent-ink);background:var(--accent-soft)}
.claim .dot{width:16px;height:21px}
.addrow{display:flex;gap:8px}
.addrow .inp{flex:1}

/* Listen */
.list{display:grid;gap:6px}
.drow{display:flex;align-items:center;gap:12px;padding:8px 10px;background:var(--card);border-radius:14px;width:100%;min-width:0}
.drow:hover{box-shadow:var(--shadow)}
.drow.newrow{border:1.5px dashed var(--accent);color:var(--accent-ink)}
.dmain{flex:1;min-width:0;display:grid}
.dmain b{font-weight:600;overflow-wrap:anywhere}
.dmain small,.dstat small{color:var(--muted);font-size:12px}
.dstat{display:grid;justify-items:end;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;color:var(--muted)}
.search input{border:0;background:transparent;flex:1;padding:10px 0;min-width:0;outline:none}
.filters{display:grid;gap:6px}
.frow{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.frow::-webkit-scrollbar{display:none}
.frow>span{font-size:12px;color:var(--muted);font-weight:700;min-width:88px;flex:none}
.frow .chip{padding:4px 10px;font-size:13px;flex:none}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.narrow{max-width:820px;display:grid;gap:14px}
.rvd{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);font-weight:600;width:62px;flex:none}

/* Bedarf */
.need-day{display:grid;gap:8px}
.need-day h3{margin:0;font-size:15px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.need-day h3 small{color:var(--muted);font-weight:500}
.empty{display:grid;justify-items:start;gap:6px;padding:24px;background:var(--card);border-radius:var(--r)}
.empty b{font-family:var(--display);font-size:18px}

/* Menü */
.mlist{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.mitem{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.mitem .mi{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mitem b{display:block}
.mitem small{color:var(--muted)}

/* Gericht */
.dish-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.photo-acts{display:grid;gap:6px}
.rrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rrow .pname{min-width:110px}
.grades{display:flex;gap:4px}
.gbtn{width:36px;height:36px;border-radius:10px;background:var(--sunk);font-weight:700;font-variant-numeric:tabular-nums;display:grid;place-items:center;text-align:center;padding:0}
.gbtn.on{background:var(--c,var(--accent));color:var(--on-pastel)}
.gbtn:disabled{cursor:default}
.gbtn:disabled:not(.on){opacity:.45}
.avgbig{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.avgbig small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500;margin-left:6px}
.spark svg{width:100%;height:auto;display:block}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.stats b{display:block;font-family:var(--display);font-size:20px}

/* Personen */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.sw{display:grid;justify-items:center;gap:4px;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600}
.sw.on{border-color:var(--accent);background:var(--accent-soft)}
.sw .c{width:32px;height:32px;border-radius:50%;background:var(--c)}
.sw small{color:var(--muted);font-size:10.5px;font-weight:500}
.code{font-family:var(--mono);font-size:24px;letter-spacing:.08em;font-weight:700}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 16px;margin:0;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
details summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}
.proto{font-size:12.5px;color:var(--muted);margin-top:22px;max-width:62ch}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:500;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>

<script>
(() => {
'use strict';

// App-Name an einer Stelle, damit eine spätere Umbenennung einfach bleibt
const APP_NAME = 'Familienmahlzeit';
const KEY = 'familienmahlzeit-proto-v1';

/* ---------- Datum ---------- */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const wd = s => (parse(s).getDay() + 6) % 7;
const mondayOf = s => addDays(s, -wd(s));
const kw = s => { const d = parse(s); d.setDate(d.getDate() + 3 - wd(s)); const w1 = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7); };
const TODAY = iso(new Date());
const DOW = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
const DOWS = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const MON = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const fmtShort = s => { const d = parse(s); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.`; };
const fmtFull = s => fmtShort(s) + parse(s).getFullYear();
const fmtAuto = s => s.slice(0, 4) === TODAY.slice(0, 4) ? fmtShort(s) : fmtFull(s);
const fmtLong = s => { const d = parse(s); return `${DOW[wd(s)]}, ${d.getDate()}. ${MON[d.getMonth()]}`; };

/* ---------- Helfer ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const round1 = v => Math.round(v * 10) / 10;
const num1 = v => v.toFixed(1).replace('.', ',');

const ICONS = {
  home: 'M3 11l9-7 9 7M5 10v10h14V10',

  gift: 'M3 9h18v4H3zM5 13v8h14v-8M12 9v12M12 9C9 9 7 8 7 6.5S9.5 4 12 9c2.5-5 5-4 5-2.5S15 9 12 9',
  box: 'M4 9h16v10H4zM3 5h18v4H3zM10 13h4',

  gear: 'M12 15a3 3 0 100-6 3 3 0 000 6zM4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4',
  download: 'M12 4v11M7 10l5 5 5-5M5 20h14',

};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`;
const LOGO = `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="12" r="7"/><circle cx="13" cy="12" r="3.5"/><path d="M3 4v6M3 10v10"/></svg>`;

const COLORS = [['Salbei', '#B8D8BA'], ['Himmelblau', '#A9CBEA'], ['Flieder', '#CDB8E6'], ['Rosé', '#F2B8C6'], ['Pfirsich', '#F7C9A3'], ['Zitrone', '#F3E3A0'], ['Minze', '#A8DED3'], ['Sand', '#DCCBB5'], ['Koralle', '#F4A6A0'], ['Lavendelgrau', '#C3C7DA']];
const KINDS = [
  { k: 'cook', l: 'Gekocht', i: 'pot', cook: true },
  { k: 'leftovers', l: 'Reste', i: 'box', cook: true },
  { k: 'surprise', l: 'Surprise', i: 'gift', cook: true },
  { k: 'bread', l: 'Brotzeit', i: 'bread', cook: false },
  { k: 'self', l: 'Jeder für sich', i: 'self', cook: false },
];
const KIND = Object.fromEntries(KINDS.map(x => [x.k, x]));
const HOW = { bring: 'bringe ich mit', way: 'besorge ich auf dem Heimweg' };
const PART = { yes: 'dabei', no: 'nicht dabei', open: 'offen' };

/* ---------- Beispieldaten ---------- */
const MAINS = [
  ['Lasagne', 'Mit Béchamel, 45 Min. im Ofen. Lässt sich am Vortag vorbereiten.', 'Fleisch', 'Pasta', '', 'Italien', 1.8],
  ['Spaghetti Bolognese', 'Soße mindestens eine Stunde köcheln lassen.', 'Fleisch', 'Pasta', '', 'Italien', 2.0],
  ['Gemüsecurry', 'Mit Kokosmilch, mild für alle, Chili extra dazu.', 'Veggie', 'Reis', 'Gemüse', 'Thai', 2.3],
  ['Sushi-Bowl', 'Lachs, Avocado, Gurke, Sushi-Reis, Sesam.', 'Fisch', 'Reis', 'Gemüse', 'Japan', 1.7],
  ['Schnitzel mit Kartoffelsalat', 'Kartoffelsalat schwäbisch, mit Brühe angemacht.', 'Fleisch', 'Kartoffel', 'Salat', 'Deutsch', 1.5],
  ['Ofenkartoffeln mit Kräuterquark', 'Große mehlige Kartoffeln, 60 Min. bei 200 °C.', 'Veggie', 'Kartoffel', 'Salat', 'Deutsch', 2.6],
  ['Chili sin Carne', 'Mit Kidneybohnen, Mais und einem Stück Zartbitterschokolade.', 'Veggie', 'Reis', 'Gemüse', 'TexMex', 2.4],
  ['Tacos', 'Hackfleisch, Salsa, Guacamole, Schmand.', 'Fleisch', '', 'Salat', 'TexMex', 1.6],
  ['Gebratene Nudeln', 'Mie-Nudeln mit Pak Choi und Ei.', 'Veggie', 'Pasta', 'Gemüse', 'China', 2.5],
  ['Lachs mit Ofengemüse', 'Lachs erst die letzten 12 Minuten aufs Blech.', 'Fisch', 'Kartoffel', 'Gemüse', '', 2.2],
  ['Pad Thai mit Garnelen', 'Reisnudeln vorher 10 Minuten einweichen.', 'Fisch', 'Pasta', 'Gemüse', 'Thai', 2.1],
  ['Pilzrisotto', 'Ständig rühren, Parmesan erst am Ende.', 'Veggie', 'Reis', '', 'Italien', 2.9],
  ['Käsespätzle', 'Mit Röstzwiebeln und grünem Salat.', 'Veggie', 'Pasta', 'Salat', 'Deutsch', 1.9],
  ['Hähnchen süß-sauer', 'Mit Ananas und Paprika.', 'Fleisch', 'Reis', 'Gemüse', 'China', 2.7],
  ['Pizza', 'Selbst belegt oder vom Lieblingsitaliener.', 'Veggie', '', '', 'Italien', 1.4],
  ['Rindergulasch', 'Am Vortag kochen, aufgewärmt schmeckt es besser.', 'Fleisch', 'Kartoffel', '', 'Deutsch', 2.4],
  ['Misosuppe mit Tofu', 'Schnell und leicht, mit Wakame.', 'Veggie', '', 'Gemüse', 'Japan', 3.6],
];
const DESSERTS = [
  ['Eis', 'Vanille, Schoko, Erdbeere aus der Truhe.', 1.6], ['Vanillepudding', 'Mit Himbeersoße.', 2.2],
  ['Apfelkuchen', 'Vom Blech, mit Sahne.', 1.9], ['Panna Cotta', 'Am Vortag zubereiten, 4 Std. kühlen.', 2.0],
  ['Crème brûlée', 'Zucker erst kurz vor dem Servieren flämmen.', 1.8], ['Tiramisu', 'Ohne Alkohol, Kakao erst zum Servieren.', 1.3],
  ['Quark mit Beeren', 'Schnell und frisch.', 2.8], ['Joghurt mit Honig', 'Griechischer Joghurt mit Walnüssen.', 3.0],
  ['Schokoladenmousse', 'Mindestens 3 Stunden kalt stellen.', 1.5],
];
const SHOP = ['Hackfleisch 500 g', 'Zucchini 2', 'Sahne', 'Parmesan', 'Basilikum', 'Reis 1 kg', 'Kokosmilch', 'Avocado 2', 'Tomaten', 'Eier 10', 'Salatkopf', 'Limetten', 'Zwiebeln', 'Brötchen'];

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const avgOf = d => { const v = Object.values(d.ratings || {}).filter(Boolean); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const blankDay = () => ({ place: 'home', kind: 'cook', cook: null, time: (state && state.family.defaultTime) || '19:00', dish: null, dessert: null, surpriseHidden: false, notes: '', guests: 0, part: {}, shop: [], snap: {} });

function seed() {
  const R = rng(42), pick = a => a[Math.floor(R() * a.length)];
  const persons = [
    { id: 'p1', name: 'Anna', fig: 'f', color: '#F2B8C6', admin: true, archived: false },
    { id: 'p2', name: 'Ben', fig: 'm', color: '#A9CBEA', admin: false, archived: false },
    { id: 'p3', name: 'Clara', fig: 'f', color: '#B8D8BA', admin: false, archived: false },
    { id: 'p4', name: 'David', fig: 'm', color: '#F7C9A3', admin: false, archived: false },
  ];
  const categories = [
    { id: 'c1', name: 'Hauptzutat', values: ['Veggie', 'Fleisch', 'Fisch'] },
    { id: 'c2', name: 'Beilage', values: ['Pasta', 'Reis', 'Kartoffel'] },
    { id: 'c3', name: 'Frisch', values: ['Gemüse', 'Salat'] },
    { id: 'c4', name: 'Küche', values: ['Japan', 'Thai', 'Deutsch', 'Italien', 'China', 'TexMex'] },
  ];
  const rate = base => { const r = {}; persons.forEach(p => { if (R() < .85) r[p.id] = clamp(Math.round(base + (R() - .5) * 2.2), 1, 6); }); return r; };
  const dishes = [
    ...MAINS.map((m, i) => ({ id: 'm' + i, type: 'main', name: m[0], desc: m[1], photo: null, cat: { c1: m[2], c2: m[3], c3: m[4], c4: m[5] }, ratings: rate(m[6]), archived: false })),
    ...DESSERTS.map((m, i) => ({ id: 's' + i, type: 'dessert', name: m[0], desc: m[1], photo: null, cat: {}, ratings: rate(m[2]), archived: false })),
  ];
  const id = n => dishes.find(d => d.name === n).id;
  const mains = dishes.filter(d => d.type === 'main' && d.name !== 'Pizza').map(d => d.id);
  const des = dishes.filter(d => d.type === 'dessert').map(d => d.id);
  const days = {};
  const mk = o => { const d = Object.assign(blankDay(), o); d.time = o.time || '19:00'; d.shop = (o.shop || []).map(s => Object.assign({ id: uid(), done: false, by: null, how: null }, s)); return d; };
  const fillPast = dt => {
    const r = R(); let o;
    if (r < .07) o = { kind: 'bread' };
    else if (r < .12) o = { kind: 'self' };
    else if (r < .17) o = { place: 'out', cook: pick(persons).id, dish: id('Pizza') };
    else if (r < .25) o = { kind: 'leftovers', cook: pick(persons).id };
    else o = { cook: pick(persons).id, dish: pick(mains) };
    if (o.kind !== 'self') {
      o.part = {}; persons.forEach(p => { o.part[p.id] = { s: (R() < .85 || p.id === o.cook) ? 'yes' : 'no' }; });
      if (R() < .12) o.guests = 1 + Math.floor(R() * 3);
      if (o.dish && R() < .25) o.dessert = pick(des);
    }
    if (o.dish && o.place !== 'out' && R() < .8) {
      o.shop = [...Array(1 + Math.floor(R() * 3))].map(() => { const by = R() < .4 ? pick(persons).id : null; return { text: pick(SHOP), done: true, by, how: by ? (R() < .5 ? 'bring' : 'way') : null }; });
    }
    if (wd(dt) >= 5 && R() < .5) o.time = '18:30';
    days[dt] = mk(o);
  };
  for (let dt = addDays(mondayOf(TODAY), -35); dt < TODAY; dt = addDays(dt, 1)) fillPast(dt);
  const y = parse(TODAY).getFullYear() - 1;
  ['11-03', '11-05', '11-08', '11-12', '11-15', '11-19', '11-22', '11-26', '12-03', '12-10', '12-17', '12-24'].forEach(md => fillPast(`${y}-${md}`));

  const T = TODAY;
  days[T] = mk({ cook: 'p2', dish: id('Lasagne'), notes: 'Lasagne braucht 45 Min. im Ofen, bitte pünktlich sein.', part: { p2: { s: 'yes' }, p1: { s: 'yes' }, p3: { s: 'yes', t: '20:00' } }, shop: [{ text: 'Lasagneplatten', done: true }, { text: 'Mozzarella 2 Kugeln', by: 'p1', how: 'way' }, { text: 'Basilikum' }] });

  days[addDays(T, 6)] = mk({ cook: 'p1', dish: id('Schnitzel mit Kartoffelsalat'), dessert: id('Tiramisu'), guests: 2, notes: 'Oma und Opa kommen.', part: { p1: { s: 'yes' } }, shop: [{ text: 'Schnitzel 6 Stück' }, { text: 'Kartoffeln festkochend 2 kg' }, { text: 'Mascarpone' }] });
  days[addDays(T, 9)] = mk({ cook: 'p2', dish: id('Tacos') });
  days[addDays(T, 11)] = mk({ kind: 'surprise', cook: 'p3' });

  Object.entries(days).forEach(([dt, d]) => {
    if (dt > TODAY) return;
    const age = (parse(TODAY) - parse(dt)) / 864e5;
    ['dish', 'dessert'].forEach(k => { const x = dishes.find(z => z.id === d[k]); const a = x && avgOf(x); if (a != null) d.snap[k] = round1(clamp(a + (R() - .5) * Math.min(1.4, age / 30), 1, 6)); });

  const devices = [

    { id: uid(), name: 'iPhone von Clara', pid: 'p3', last: addDays(TODAY, -1) }, { id: uid(), name: 'iPhone von David', pid: 'p4', last: TODAY },
  ];
  return { v: 1, family: { name: 'Familie Muster', code: 'KOCH-7F3Q-92', pin: '1234', defaultTime: '19:00' }, persons, categories, dishes, days, devices, cal: {} };
}

/* ---------- Zustand ---------- */
let state = null;
function load() { try { const s = localStorage.getItem(KEY); if (s) { const o = JSON.parse(s); if (o && o.v === 1 && o.days) return o; } } catch (e) {} return null; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function saveUi() { try { localStorage.setItem(KEY + '-ui', JSON.stringify({ me: ui.me, theme: ui.theme })); } catch (e) {} }
state = load() || seed();
state.persons.forEach(p => { if (!p.fig) p.fig = 'n'; });
let uiSaved = {}; try { uiSaved = JSON.parse(localStorage.getItem(KEY + '-ui') || '{}') || {}; } catch (e) {}
const ui = {
  me: uiSaved.me && state.persons.some(p => p.id === uiSaved.me) ? uiSaved.me : null,
  theme: uiSaved.theme || 'light',
  tab: 'week', week: mondayOf(TODAY),
  dlist: { type: 'main', q: '', sort: 'alpha', filter: {} },
};
let sheets = [];

const person = id => state.persons.find(p => p.id === id);
const pn = id => (person(id) || {}).name || '';
const activePersons = () => state.persons.filter(p => !p.archived);
const dish = id => state.dishes.find(d => d.id === id);
const dn = id => (dish(id) || {}).name || '';
const getDay = (dt, create) => { if (!state.days[dt] && create) state.days[dt] = blankDay(); return state.days[dt]; };
const hasPlan = d => !!d && (d.cook || d.dish || d.dessert || d.kind !== 'cook' || d.place !== 'home');
const isHidden = (dt, d) => d.kind === 'surprise' && d.surpriseHidden && dt >= TODAY && d.cook !== ui.me;
const myStatus = dt => state.days[dt]?.part?.[ui.me]?.s || 'open';
const gcls = a => a <= 2 ? 'good' : a <= 3.5 ? 'mid' : 'low';
const top = () => sheets[sheets.length - 1];

function stats() {
  const m = {};
  for (const [dt, d] of Object.entries(state.days)) {
    if (dt > TODAY || d.kind === 'self') continue;
    for (const k of ['dish', 'dessert']) { const id = d[k]; if (!id) continue; const s = m[id] || (m[id] = { n: 0, last: null }); s.n++; if (!s.last || dt > s.last) s.last = dt; }
  }
  return m;
}
function snapDay(dt) {
  const d = state.days[dt]; if (!d || dt > TODAY) return;
  ['dish', 'dessert'].forEach(k => { const x = dish(d[k]); const a = x && avgOf(x); if (a != null) d.snap[k] = round1(a); else delete d.snap[k]; });
}
function ensureSnaps() { for (const [dt, d] of Object.entries(state.days)) if (dt <= TODAY && ((d.dish && d.snap.dish == null) || (d.dessert && d.snap.dessert == null))) snapDay(dt); }
function catLine(d) { return state.categories.map(c => d.cat?.[c.id]).filter(Boolean).join(' · '); }
function tint(d) {
  if (d.type === 'dessert') return '#F3D6E6';
  return { Veggie: '#CFE6C8', Fleisch: '#F5CFCB', Fisch: '#CDE0F2' }[d.cat?.c1] || '#EEDFCB';
}
function thumb(d, size = '') {
  if (!d) return '';
  if (d.photo) return `<span class="th ${size}"><img src="${d.photo}" alt=""></span>`;
  // Desserts tragen keinen Buchstaben, der Name steht ohnehin daneben
  const letter = d.type === 'dessert' ? '' : esc((d.name || '?').trim().charAt(0).toUpperCase() || '?');
  return `<span class="th ${size}" style="--t:${tint(d)}">${letter}</span>`;
}
// Personenfigur mit Anfangsbuchstaben auf der Brust.
// Frau: langes Haar um den Kopf, Kleid mit schmaler Taille. Mann: kurzes Haar, breite Schultern, Hosenbeine. Neutral: schlicht.
const FIG = {
  f: { hair: '<path class="hr" d="M7 14.5V8a7 7 0 0114 0v6.5z"/>', head: '<circle class="h" cx="14" cy="7.6" r="4.6"/>', body: 'M10.6 14.5h6.8l-1.6 6.3L25.5 35h-23l9.7-14.2z', ty: 30.5 },
  m: { head: '<circle class="h" cx="14" cy="7" r="5.5"/>', hair: '<path class="hr" d="M8.5 6.2a5.5 5.5 0 0111 0C17.9 4.9 16 4.3 14 4.3s-3.9.6-5.5 1.9z"/>', body: 'M2.5 27v-6.5A6.5 6.5 0 019 14h10a6.5 6.5 0 016.5 6.5V27h-4v8H15v-7h-2v7H6.5v-8z', ty: 24.6 },
  n: { head: '<circle class="h" cx="14" cy="6.5" r="5.5"/>', body: 'M3 35v-9a11 11 0 0122 0v9z', ty: 29.5 },
};
function figSvg(p) {
  const f = FIG[(p && p.fig) || 'n'] || FIG.n;
  const parts = p && p.fig === 'f' ? f.hair + f.head : f.head + (f.hair || '');
  return `<svg class="fig" viewBox="0 0 28 36" aria-hidden="true">${parts}<path class="b" d="${f.body}"/>${p ? `<text x="14" y="${f.ty}">${esc(p.name.charAt(0).toUpperCase())}</text>` : ''}</svg>`;
}
function dot(p, cls = '') {
  if (!p) return `<span class="dot ghost ${cls}">${figSvg(null)}</span>`;
  return `<span class="dot ${cls}" style="--c:${p.color}" aria-hidden="true">${figSvg(p)}</span>`;
}
function dayWhat(dt, d) {
  if (d.kind === 'self') return 'Jeder für sich';
  if (isHidden(dt, d)) return 'Surprise';
  if (d.dish) return dn(d.dish);
  if (d.kind === 'surprise') return 'Surprise (noch offen)';
  if (d.kind !== 'cook') return KIND[d.kind].l;
  return 'Gericht offen';
}
const openShop = dt => (state.days[dt]?.shop || []).filter(s => !s.done).length;

/* Kalender */
function calSig(dt) { const d = state.days[dt]; if (!d) return ''; const my = d.part[ui.me]; return [d.time, (my && my.t) || '', d.dish || '', d.cook || '', d.kind, d.place].join('|'); }
function calStale(dt) { const k = ui.me + '|' + dt; return state.cal[k] != null && state.cal[k] !== calSig(dt); }
function calRelevant(dt) { const d = state.days[dt]; return !!d && dt >= TODAY && d.kind !== 'self' && (d.cook === ui.me || d.part[ui.me]?.s === 'yes'); }
function evInfo(dt) {
  const d = state.days[dt], my = d.part[ui.me], t = (my && my.t) || d.time;
  const who = d.cook ? ` (${d.place === 'out' ? 'organisiert von' : 'Koch'}: ${pn(d.cook)})` : '';
  return { title: `${APP_NAME}: ${dayWhat(dt, d)}${who}`, when: `${DOW[wd(dt)]}, ${fmtFull(dt)}, ${t} Uhr`, t, place: d.place === 'out' ? 'auswärts' : 'zu Hause' };
}
function ics(dts) {
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', `PRODID:-//${APP_NAME}//DE`];
  dts.forEach(dt => {
    const e = evInfo(dt), stamp = dt.replace(/-/g, '') + 'T' + e.t.replace(':', '') + '00';
    L.push('BEGIN:VEVENT', `UID:${dt}-${ui.me}@familie`, `DTSTART;TZID=Europe/Berlin:${stamp}`, 'DURATION:PT1H', `SUMMARY:${e.title}`, `LOCATION:${e.place}`);
    [90, 60].forEach(m => L.push('BEGIN:VALARM', `TRIGGER:-PT${m}M`, 'ACTION:DISPLAY', `DESCRIPTION:${e.title}`, 'END:VALARM'));
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\n');
}

/* ---------- Ansichten ---------- */
function header() {
  const me = person(ui.me);
  let nav = '';
  if (ui.tab === 'week') {
    const ws = ui.week, we = addDays(ws, 6);
    nav = `<div class="weeknav gutter">
      <button class="icon-btn" data-act="wk" data-d="-7" aria-label="Vorige Woche">${ic('left')}</button>
      <div class="wk"><span class="kw">KW ${kw(ws)}</span><span class="range">${fmtShort(ws)} – ${fmtFull(we)}</span></div>
      ${ws !== mondayOf(TODAY) ? `<button class="pill" data-act="today">Heute</button>` : ''}
      <button class="icon-btn" data-act="wk" data-d="7" aria-label="Nächste Woche">${ic('right')}</button>
    </div>`;
  }
  return `<header class="top"><div class="top-in gutter">
    <div class="brand"><span class="logo">${LOGO}</span><span>${APP_NAME}</span></div>
    <button class="me" data-act="switchMe" aria-label="Person wechseln">${dot(me)} ${esc(me ? me.name : 'Wer bin ich?')}</button>
  </div>${nav}</header>`;
}

function tabbar() {
  const need = [...Array(7)].reduce((n, _, i) => n + openShop(addDays(TODAY, i)), 0);
  const t = [['week', 'week', 'Woche'], ['need', 'cart', 'Bedarf'], ['dishes', 'book', 'Gerichte'], ['menu', 'menu', 'Menü']];
  return `<nav class="tabs" aria-label="Bereiche">${t.map(([k, i, l]) => `<button data-act="tab" data-v="${k}" ${ui.tab === k ? 'aria-current="page"' : ''}><span class="tic">${ic(i)}</span>${l}${k === 'need' && need ? `<span class="cnt">${need}</span>` : ''}</button>`).join('')}</nav>`;
}

function hints() {
  if (ui.week !== mondayOf(TODAY) || !ui.me) return '';
  const out = [], d = state.days[TODAY];
  if (d && d.cook === ui.me && KIND[d.kind].cook) out.push(`Du kochst heute um ${d.time} Uhr${d.dish ? ': ' + esc(dn(d.dish)) : ''}.`);
  const n = openShop(addDays(TODAY, 1)); if (n) out.push(`${n} ${n === 1 ? 'Einkauf' : 'Einkäufe'} für morgen offen.`);
  const open = [0, 1, 2].map(i => addDays(TODAY, i)).filter(x => (state.days[x]?.kind !== 'self') && myStatus(x) === 'open');
  if (open.length) out.push(`Sag noch zu oder ab: ${open.map(x => DOWS[wd(x)]).join(', ')}.`);
  const stale = [...Array(7)].map((_, i) => addDays(TODAY, i)).filter(calStale);
  if (stale.length) out.push(`Kalender veraltet für ${stale.map(x => DOWS[wd(x)]).join(', ')}.`);
  return out.length ? `<div class="hints">${out.map(t => `<p>${t}</p>`).join('')}</div>` : '';
}

function stepper(dt, g) {
  return `<span class="stepper"><button data-act="g" data-date="${dt}" data-d="-1" aria-label="Ein Gast weniger" ${g <= 0 ? 'disabled' : ''}>−</button><b>${g}</b><button data-act="g" data-date="${dt}" data-d="1" aria-label="Ein Gast mehr" ${g >= 9 ? 'disabled' : ''}>+</button></span>`;
}

function dayCard(dt) {
  const d = state.days[dt], past = dt < TODAY, today = dt === TODAY;
  const planned = hasPlan(d);
  const kind = d ? d.kind : 'cook';
  // Feste Plätze in fester Reihenfolge: Auf dem iPad stehen sie in allen Spalten auf gleicher Höhe, leere Plätze bleiben frei
  const slot = (cls, html = '') => `<div class="slot ${cls}">${html}</div>`;
  const out = planned && d.place === 'out', k = KIND[kind], open = !planned && !past;
  const s = [];
  s.push(slot('meta', planned
    ? `<span class="tag ${out ? 'out' : ''}">${ic(out ? 'out' : 'home')}${out ? 'auswärts' : '@home'}</span><span class="time">${ic('clock')}${d.time}</span>`
    : `<span class="empty-note">${past ? 'Nichts eingetragen' : 'Noch nicht geplant'}</span>`));
  if ((planned && k.cook) || open) {
    const p = planned ? person(d.cook) : null;
    s.push(slot('cook', `${dot(p)}<span>${p ? esc(p.name) : '<span class="muted">Koch offen</span>'}</span>${out && p ? '<small>organisiert</small>' : ''}`));
  } else s.push(slot('cook', planned ? `${dot(null)}<span class="muted">ohne Koch</span>` : ''));
  s.push(slot(`kind k-${kind}`, planned ? `${ic(k.i)}${k.l}` : ''));
  let dishHtml = '';
  if (planned && kind !== 'self') {
    if (isHidden(dt, d)) dishHtml = `<span class="th sm surprise-plate">${ic('gift')}</span><div class="dish-t"><b class="surprise">Surprise</b></div>`;
    else if (d.dish) { const x = dish(d.dish), a = past ? d.snap.dish : avgOf(x); dishHtml = `${thumb(x, 'sm')}<div class="dish-t"><b>${esc(x.name)}</b>${a != null ? `<span class="grade ${gcls(a)}">⌀ ${num1(a)}</span>` : ''}</div>`; }
    else dishHtml = `<span class="th sm plate-empty"></span><span class="muted">${kind === 'surprise' ? 'Gericht folgt' : kind === 'cook' ? 'Gericht offen' : 'kein Gericht'}</span>`;
  } else if (open) dishHtml = `<span class="th sm plate-empty"></span><span class="muted">Gericht offen</span>`;
  s.push(slot('dish', dishHtml));
  s.push(slot('dessert', planned && d.dessert ? `${thumb(dish(d.dessert), 'xs')}${esc(dn(d.dessert))}` : ''));
  if (kind !== 'self' && (planned || !past)) {
    const part = (d && d.part) || {}, timed = activePersons().some(p => part[p.id]?.t && part[p.id]?.s === 'yes');
    const cnt = st => activePersons().filter(p => (part[p.id]?.s || 'open') === st).length;
    s.push(slot('psum', `<b>${cnt('yes')} dabei</b>${cnt('open') ? ` · ${cnt('open')} offen` : ''}${cnt('no') ? ` · ${cnt('no')} nicht dabei` : ''}`));
    s.push(`<div class="slot part ${timed ? 'timed' : ''}">${activePersons().map(p => {
      const v = part[p.id] || { s: 'open' }, mine = p.id === ui.me && !past, t = v.s === 'yes' && v.t ? `<i>${v.t}</i>` : '';
      const lbl = `${p.name}: ${PART[v.s]}${v.t && v.s === 'yes' ? ' ab ' + v.t : ''}`;
      return mine
        ? `<button class="pdot s-${v.s} mine" style="--c:${p.color}" data-act="togglePart" data-lp="myPart" data-date="${dt}" aria-label="${esc(lbl)}. Antippen zum Ändern, lange drücken für Uhrzeit" title="${esc(lbl)}">${figSvg(p)}${t}</button>`
        : `<span class="pdot s-${v.s}" style="--c:${p.color}" title="${esc(lbl)}" aria-label="${esc(lbl)}">${figSvg(p)}${t}</span>`;
    }).join('')}</div>`);
    const g = d ? d.guests : 0, yes = Object.values(part).filter(v => v.s === 'yes').length;
    const n = openShop(dt), stale = !past && ui.me && calStale(dt);
    s.push(slot('foot', `${n ? `<span class="badge">${ic('cart')}${n} offen</span>` : ''}${stale ? `<span class="badge warn">Kalender veraltet</span>` : ''}`));
    s.push(slot('foot guests', `<span class="lbl">Gäste</span>${past ? `<b>${g}</b>` : stepper(dt, g)}<span class="muted">= ${yes + g} ${yes + g === 1 ? 'Person' : 'Personen'}</span>`));
  } else s.push(slot('psum'), slot('part'), slot('foot'), slot('foot guests'));
  const main = s.join('');
  return `<article class="day ${past ? 'past' : ''} ${today ? 'today' : ''}" data-act="openDay" data-date="${dt}" role="button" tabindex="0" aria-label="${fmtLong(dt)} öffnen">
    <div class="day-date"><span class="dow">${DOWS[wd(dt)]}</span><span class="dnum">${parse(dt).getDate()}</span>${today ? '<span class="today-flag">heute</span>' : ''}</div>
    <div class="day-main">${main}</div></article>`;
}

function weekView() {
  const days = [...Array(7)].map((_, i) => addDays(ui.week, i));
  return `${hints()}<div class="week">${days.map(dayCard).join('')}</div>
  <div class="week-foot">

    <p class="proto">Klickbarer Prototyp mit Beispieldaten. Änderungen bleiben nur in diesem Browser. In der Familienversion sehen alle Geräte dieselben Daten.</p>
  </div>`;
}

function shopList(dt, mode) {
  const d = state.days[dt] || blankDay();
  let items = [...d.shop].sort((a, b) => a.done - b.done);
  if (mode === 'need') items = items.filter(s => !s.done);
  const ro = mode === 'ro';
  const li = items.map(it => {
    const p = person(it.by);
    const claim = p ? `<button class="claim" ${ro ? 'disabled' : `data-act="claim" data-date="${dt}" data-id="${it.id}"`}>${dot(p)} ${esc(p.name)}: ${HOW[it.how] || 'übernimmt'}</button>`
      : (!it.done && !ro ? `<button class="claim open" data-act="claim" data-date="${dt}" data-id="${it.id}">Übernehme ich</button>` : '');
    return `<li class="${it.done ? 'done' : ''}">
      <button class="check" ${ro ? 'disabled' : `data-act="shopToggle" data-date="${dt}" data-id="${it.id}"`} role="checkbox" aria-checked="${it.done}" aria-label="${esc(it.text)} abhaken">${it.done ? ic('check') : ''}</button>
      <span class="stxt">${esc(it.text)}</span>${claim}
      ${mode === 'edit' ? `<button class="icon-btn sm" data-act="shopDel" data-date="${dt}" data-id="${it.id}" aria-label="${esc(it.text)} entfernen">${ic('x')}</button>` : ''}
    </li>`;
  }).join('');
  let h = items.length ? `<ul class="shop">${li}</ul>` : (mode === 'edit' ? '<p class="help">Noch nichts auf der Liste.</p>' : '');
  if (mode === 'edit') h += `<div class="addrow"><input class="inp" id="shop-new" placeholder="Was wird gebraucht? z. B. 2 Zucchini" data-enter="shopAdd" data-date="${dt}" autocomplete="off"><button class="btn" data-act="shopAdd" data-date="${dt}">Hinzufügen</button></div>`;
  return h;
}

function needView() {
  const ds = [...Array(7)].map((_, i) => addDays(TODAY, i));
  const blocks = ds.filter(dt => openShop(dt)).map(dt => {
    const d = state.days[dt];
    return `<section class="need-day"><h3>${dt === TODAY ? 'Heute' : DOW[wd(dt)]}, ${fmtShort(dt)} <small>${esc(dayWhat(dt, d))}${d.cook ? ' · ' + esc(pn(d.cook)) : ''}</small></h3>${shopList(dt, 'need')}</section>`;
  });
  const done = ds.reduce((n, dt) => n + (state.days[dt]?.shop || []).filter(s => s.done).length, 0);
  return `<div class="narrow">
    <div class="toolbar"><h1 class="page-title">Bedarf</h1><span class="muted">${fmtShort(TODAY)} – ${fmtShort(addDays(TODAY, 6))}</span></div>
    <p class="help">Alles, was in den nächsten 7 Tagen noch fehlt. Abhaken oder übernehmen geht direkt hier, auch ohne Netz.</p>
    ${blocks.length ? blocks.join('') : `<div class="empty"><b>Alles besorgt</b><span class="muted">Für die nächsten 7 Tage ist nichts mehr offen.</span></div>`}
    ${done ? `<p class="help">${done} ${done === 1 ? 'Eintrag' : 'Einträge'} bereits erledigt.</p>` : ''}
  </div>`;
}

function dishList(cfg, scope) {
  const st = stats(), act = scope === 'pick' ? 'pickSel' : 'openDish';
  let ds = state.dishes.filter(d => d.type === cfg.type && !d.archived);
  const q = cfg.q.trim().toLowerCase();
  if (q) ds = ds.filter(d => d.name.toLowerCase().includes(q) || (d.desc || '').toLowerCase().includes(q));
  for (const [c, v] of Object.entries(cfg.filter)) ds = ds.filter(d => d.cat?.[c] === v);
  const byName = (a, b) => a.name.localeCompare(b.name, 'de');
  if (cfg.sort === 'alpha') ds.sort(byName);
  if (cfg.sort === 'freq') ds.sort((a, b) => ((st[b.id]?.n || 0) - (st[a.id]?.n || 0)) || byName(a, b));
  if (cfg.sort === 'grade') ds.sort((a, b) => ((avgOf(a) ?? 9) - (avgOf(b) ?? 9)) || byName(a, b));
  let h = '';
  if (scope === 'pick' && q && !state.dishes.some(d => d.type === cfg.type && !d.archived && d.name.toLowerCase() === q))
    h += `<button class="drow newrow" data-act="pickNew">${ic('plus')}<div class="dmain"><b>„${esc(cfg.q.trim())}“ neu anlegen</b><small>als ${cfg.type === 'main' ? 'Gericht' : 'Dessert'}, Details danach ergänzen</small></div></button>`;
  if (!ds.length && !h) h = `<p class="help">Keine Treffer.${Object.keys(cfg.filter).length ? ' Tippe einen aktiven Filter erneut an, um ihn aufzuheben.' : ''}</p>`;
  h += ds.map(d => {
    const a = avgOf(d), s = st[d.id];
    return `<button class="drow" data-act="${act}" data-id="${d.id}">${thumb(d)}<div class="dmain"><b>${esc(d.name)}</b>${d.type === 'main' ? `<small>${esc(catLine(d) || 'ohne Kategorie')}</small>` : ''}
      <small>${a != null ? `<span class="grade ${gcls(a)}">⌀ ${num1(a)}</span>` : 'ohne Note'} · ${s ? `${s.n}× · zuletzt ${fmtAuto(s.last)}` : (d.type === 'dessert' ? 'noch nie serviert' : 'noch nie gekocht')}</small></div></button>`;
  }).join('');
  return h;
}
function listControls(cfg, scope) {
  return `<div class="search">${ic('search')}<input id="${scope}-q" type="search" placeholder="${scope === 'pick' ? 'Suchen oder neu anlegen' : 'Suchen'}" value="${esc(cfg.q)}" data-in="listQ" data-scope="${scope}" autocomplete="off" aria-label="Gerichte durchsuchen"></div>
  <div class="toolbar"><div class="seg sm" role="group" aria-label="Sortierung">${[['alpha', 'A–Z'], ['freq', 'Häufigkeit'], ['grade', 'Note']].map(([v, l]) => `<button class="${cfg.sort === v ? 'on' : ''}" data-act="sort" data-scope="${scope}" data-v="${v}">${l}</button>`).join('')}</div></div>
  ${cfg.type === 'main' ? `<div class="filters">${state.categories.map(c => `<div class="frow"><span>${esc(c.name)}</span>${c.values.map(v => `<button class="chip ${cfg.filter[c.id] === v ? 'on' : ''}" data-act="filt" data-scope="${scope}" data-c="${c.id}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`).join('')}</div>` : ''}
  <div class="list" id="${scope}-list">${dishList(cfg, scope)}</div>`;
}

function dishesView() {

];
function menuView() {
  return `<div class="toolbar" style="margin-bottom:12px"><h1 class="page-title">Menü</h1><span class="muted">${esc(state.family.name)}</span></div>
  <div class="mlist">${MENU.map(([k, i, l, s]) => `<button class="mitem" data-act="menu" data-v="${k}"><span class="mi">${ic(i)}</span><span><b>${l}</b><small>${s}</small></span></button>`).join('')}</div>
  <div class="week-foot"><button class="btn ghost sm" data-act="reset">${ic('reset')} Beispieldaten zurücksetzen</button>
  <p class="proto">Prototyp, Stufe 1. Kalender, Export und Sicherung sind hier simuliert. In der Familienversion werden echte Dateien erzeugt und alle Geräte über Firebase abgeglichen.</p></div>`;
}

/* ---------- Sheets ---------- */
function seg(act, dt, cur, opts) { return opts.map(([v, l]) => `<button class="${cur === v ? 'on' : ''}" data-act="${act}" data-date="${dt}" data-v="${v}">${l}</button>`).join(''); }
function pickBtn(dt, slot, id) {
  const x = dish(id), a = x && avgOf(x);
  return `<button class="pickbtn" data-act="pick" data-date="${dt}" data-slot="${slot}">${x ? thumb(x, 'sm') : `<span class="th sm">${ic(slot === 'dish' ? 'pot' : 'cake')}</span>`}
    <div class="dmain"><b>${x ? esc(x.name) : (slot === 'dish' ? 'Gericht wählen' : 'Dessert wählen (optional)')}</b><small>${x ? (a != null ? '⌀ ' + num1(a) : 'noch ohne Note') + (catLine(x) ? ' · ' + esc(catLine(x)) : '') : 'Aus der Liste wählen oder neu anlegen'}</small></div>${ic('right')}</button>`;
}

function sheetDay(a) {
  const dt = a.date, ro = dt < TODAY && !a.edit, d = state.days[dt] || blankDay();
  const title = fmtLong(dt) + (dt === TODAY ? ' · heute' : '');
  if (ro) return { title, body: dayReadonly(dt, d) };
  const k = KIND[d.kind];
  let b = '';
  if (dt < TODAY) b += `<p class="note">Rückwirkende Korrektur. Änderungen gelten sofort für alle.</p>`;
  b += `<div class="field"><span class="flabel">Ort</span><div class="seg">${seg('place', dt, d.place, [['home', '@home'], ['out', 'auswärts']])}</div></div>`;
  b += `<div class="field"><span class="flabel">Art</span><div class="chips">${KINDS.map(x => `<button class="chip ${d.kind === x.k ? 'on' : ''}" data-act="kind" data-date="${dt}" data-v="${x.k}">${ic(x.i)} ${x.l}</button>`).join('')}</div>
    ${!k.cook ? `<p class="help">${d.kind === 'bread' ? 'Brotzeit: alle zu Hause, ohne Koch.' : 'Jeder für sich: kein gemeinsames Essen, kein Koch.'}</p>` : ''}</div>`;
  if (k.cook) b += `<div class="field"><span class="flabel">${d.place === 'out' ? 'Organisiert von' : 'Koch'}</span><div class="chips">${activePersons().map(p => `<button class="chip ${d.cook === p.id ? 'on' : ''}" data-act="cook" data-date="${dt}" data-pid="${p.id}">${dot(p)} ${esc(p.name)}</button>`).join('')}<button class="chip add" data-act="newPerson">${ic('plus')} Person</button></div></div>`;
  b += `<div class="field"><label for="day-time">Uhrzeit</label><input class="inp" type="time" id="day-time" value="${d.time}" data-in="dayTime" data-date="${dt}"></div>`;
  if (d.kind !== 'self') {
    const hidden = isHidden(dt, d);
    b += `<div class="field"><span class="flabel">Gericht</span>${hidden
      ? `<div class="pickbtn"><span class="th sm">${ic('gift')}</span><div class="dmain"><b>Surprise</b><small>${esc(pn(d.cook))} verrät es noch nicht. Ab morgen ist es für alle sichtbar.</small></div></div>`
      : pickBtn(dt, 'dish', d.dish)}
      ${d.kind === 'surprise' && d.cook && d.cook === ui.me ? `<button class="switch ${d.surpriseHidden ? 'on' : ''}" data-act="toggleHide" data-date="${dt}" role="switch" aria-checked="${d.surpriseHidden}"><span></span>Gericht für die anderen verbergen</button>` : ''}
      ${d.kind === 'surprise' && !d.dish && !hidden ? '<p class="help">Ohne Gericht ist Surprise ein Platzhalter. Das Gericht kann später nachgetragen werden.</p>' : ''}</div>`;
    b += `<div class="field"><span class="flabel">Dessert</span>${pickBtn(dt, 'dessert', d.dessert)}</div>`;
  }
  b += `<div class="field"><label for="day-notes">Hinweise</label><textarea class="inp" id="day-notes" rows="2" data-in="dayNotes" data-date="${dt}" placeholder="z. B. Bitte Tisch decken, Salat macht Clara">${esc(d.notes)}</textarea></div>`;
  if (d.kind !== 'self') {
    const yes = Object.values(d.part).filter(v => v.s === 'yes').length;
    b += `<div class="field"><span class="flabel">Teilnahme</span><div class="card plist">${activePersons().map(p => {
      const v = d.part[p.id] || { s: 'open' };
      return `<div class="prow">${dot(p)}<span class="pname">${esc(p.name)}${p.id === ui.me ? ' <span class="muted">(du)</span>' : ''}</span>
        <div class="seg sm">${[['yes', 'Dabei'], ['no', 'Nein'], ['open', 'Offen']].map(([s, l]) => `<button class="${v.s === s ? 'on' : ''}" data-act="partSet" data-date="${dt}" data-pid="${p.id}" data-s="${s}">${l}</button>`).join('')}</div>
        ${v.s === 'yes' ? `<label class="ptime">ab <input class="inp sm" type="time" value="${v.t || ''}" data-in="partTime" data-date="${dt}" data-pid="${p.id}" aria-label="Abweichende Uhrzeit für ${esc(p.name)}"></label>` : ''}</div>`;
    }).join('')}<div class="prow"><span class="pname">Gäste</span>${stepper(dt, d.guests)}</div></div>
    <p class="help">${yes} ${yes === 1 ? 'Zusage' : 'Zusagen'} + ${d.guests} ${d.guests === 1 ? 'Gast' : 'Gäste'} = <b>${yes + d.guests} Personen</b>. Die Uhrzeit „ab“ nur ausfüllen, wenn sie abweicht.</p></div>`;
  }
  b += `<div class="field"><span class="flabel">Einkauf für diesen Tag</span>${shopList(dt, 'edit')}</div>`;
  if (dt >= TODAY && ui.me && calRelevant(dt)) b += `<div class="field"><span class="flabel">Kalender</span><button class="btn ghost" data-act="cal" data-date="${dt}">${ic('cal')} ${calStale(dt) ? 'Kalender aktualisieren' : 'In Kalender übernehmen'}</button><p class="help">Termin mit Erinnerung 90 und 60 Minuten vorher.</p></div>`;
  return { title, body: b };
}

function dayReadonly(dt, d) {
  const x = dish(d.dish), y = dish(d.dessert);
  const yes = Object.entries(d.part).filter(([, v]) => v.s === 'yes').map(([k, v]) => pn(k) + (v.t ? ` (ab ${v.t})` : ''));
  let b = `<dl class="kv">
    <dt>Ort</dt><dd>${d.place === 'out' ? 'auswärts' : '@home'}</dd>
    <dt>Art</dt><dd>${KIND[d.kind].l}</dd>
    ${KIND[d.kind].cook ? `<dt>${d.place === 'out' ? 'Organisiert von' : 'Koch'}</dt><dd>${esc(pn(d.cook) || '–')}</dd>` : ''}
    <dt>Uhrzeit</dt><dd>${d.time}</dd>
    ${d.kind !== 'self' ? `<dt>Gericht</dt><dd>${x ? esc(x.name) + (d.snap.dish != null ? ` <span class="grade ${gcls(d.snap.dish)}">⌀ ${num1(d.snap.dish)} am Kochtag</span>` : '') : '–'}</dd>` : ''}
    ${y ? `<dt>Dessert</dt><dd>${esc(y.name)}</dd>` : ''}
    ${d.kind !== 'self' ? `<dt>Dabei</dt><dd>${yes.length ? esc(yes.join(', ')) : '–'}${d.guests ? ` + ${d.guests} ${d.guests === 1 ? 'Gast' : 'Gäste'}` : ''}</dd>` : ''}
    ${d.notes ? `<dt>Hinweise</dt><dd>${esc(d.notes)}</dd>` : ''}
  </dl>`;
  if (x || y) b += `<div class="row">${x ? `<button class="btn" data-act="openDish" data-id="${x.id}">${ic('book')} ${esc(x.name)} bewerten</button>` : ''}${y ? `<button class="btn ghost" data-act="openDish" data-id="${y.id}">${ic('cake')} ${esc(y.name)} bewerten</button>` : ''}</div>`;
  if (d.shop.length) b += `<div class="field"><span class="flabel">Einkauf</span>${shopList(dt, 'ro')}</div>`;
  b += `<p class="help">Vergangene Tage sind in der Wochenansicht nur lesbar. Korrigieren kannst du sie über Menü → Rückblick.</p>`;
  return b;
}

function sheetMyPart(a) {
  const dt = a.date, d = state.days[dt] || blankDay(), v = d.part[ui.me] || { s: 'open' };
  return { title: `${DOW[wd(dt)]}, ${fmtShort(dt)}: deine Teilnahme`, body: `
    <div class="seg">${[['yes', 'Dabei'], ['no', 'Nicht dabei'], ['open', 'Offen']].map(([s, l]) => `<button class="${v.s === s ? 'on' : ''}" data-act="partSet" data-date="${dt}" data-pid="${ui.me}" data-s="${s}">${l}</button>`).join('')}</div>
    ${v.s === 'yes' ? `<div class="field"><label for="my-time">Abweichende Uhrzeit (Essen um ${d.time})</label><div class="row"><input class="inp" type="time" id="my-time" value="${v.t || ''}" data-in="partTime" data-date="${dt}" data-pid="${ui.me}">${v.t ? `<button class="btn ghost sm" data-act="partTimeClear" data-date="${dt}">Zurücksetzen</button>` : ''}</div><p class="help">Alle sehen die Uhrzeit unter deinem Punkt.</p></div>` : ''}
    <button class="btn wide" data-act="close">Fertig</button>` };
}

function sheetPick(a) {
  return { title: a.slot === 'dish' ? 'Gericht wählen' : 'Dessert wählen', body: `
    ${state.days[a.date]?.[a.slot] ? `<button class="btn ghost sm" data-act="pickNone">${ic('x')} ${a.slot === 'dish' ? 'Kein Gericht' : 'Kein Dessert'}</button>` : ''}
    ${listControls(a, 'pick')}` };
}

function spark(id, key) {
  const pts = Object.entries(state.days).filter(([dt, d]) => d[key] === id && d.snap[key] != null && dt <= TODAY).sort(([a], [b]) => a < b ? -1 : 1).map(([dt, d]) => ({ dt, v: d.snap[key] }));
  if (pts.length < 2) return '<p class="help">Der Verlauf erscheint, sobald das Gericht mindestens zweimal gekocht wurde.</p>';
  const W = 320, H = 96, x0 = 22, x1 = W - 8, y0 = 10, y1 = H - 22;
  const X = i => x0 + (pts.length === 1 ? 0 : i * (x1 - x0) / (pts.length - 1)), Y = v => y0 + (v - 1) / 5 * (y1 - y0);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
  const last = pts[pts.length - 1];
  return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf der Durchschnittsnote von ${num1(pts[0].v)} auf ${num1(last.v)}">
    ${[1, 3.5, 6].map(v => `<line x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${x0 - 6}" y="${Y(v) + 4}" font-size="10" text-anchor="end" fill="var(--muted)">${String(v).replace('.', ',')}</text>`).join('')}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.v)}" r="${i === pts.length - 1 ? 4 : 2.5}" fill="${i === pts.length - 1 ? 'var(--accent)' : 'var(--card)'}" stroke="var(--accent)" stroke-width="1.5"/>`).join('')}
    <text x="${x0}" y="${H - 6}" font-size="10" fill="var(--muted)">${fmtShort(pts[0].dt)}</text>
    <text x="${x1}" y="${H - 6}" font-size="10" text-anchor="end" fill="var(--muted)">${fmtShort(last.dt)} · ⌀ ${num1(last.v)}</text>
  </svg></div><p class="help">Durchschnittsnote, wie sie an jedem Kochtag gespeichert wurde. Oben ist besser (1 = sehr gut).</p>`;
}

function sheetDish(a) {
  const d = dish(a.id); if (!d) return { title: 'Gericht', body: '<p class="help">Nicht gefunden.</p>' };
  const av = avgOf(d), st = stats()[d.id], n = Object.values(d.ratings).filter(Boolean).length, key = d.type === 'main' ? 'dish' : 'dessert';
  let b = `<div class="dish-head">${thumb(d, 'lg')}<div class="photo-acts">
      <label class="btn ghost sm">${ic('photo')} ${d.photo ? 'Foto ändern' : 'Foto hinzufügen'}<input type="file" accept="image/*" data-ch="photo" data-id="${d.id}" hidden></label>
      ${d.photo ? `<button class="btn ghost sm" data-act="photoDel" data-id="${d.id}">Foto entfernen</button>` : ''}
      <span class="help">Wird automatisch verkleinert.</span></div></div>
    <div class="field"><label for="dish-name">Name</label><input class="inp" id="dish-name" value="${esc(d.name)}" data-in="dishName" data-id="${d.id}" placeholder="z. B. Gemüselasagne" autocomplete="off"></div>
    <div class="field"><label for="dish-desc">Beschreibung und Hinweise</label><textarea class="inp" id="dish-desc" rows="3" data-in="dishDesc" data-id="${d.id}" placeholder="Zubereitung, Tipps, Varianten">${esc(d.desc)}</textarea></div>`;
  if (d.type === 'main') b += state.categories.map(c => `<div class="field"><span class="flabel">${esc(c.name)}</span><div class="chips">${c.values.map(v => `<button class="chip ${d.cat[c.id] === v ? 'on' : ''}" data-act="dishCat" data-id="${d.id}" data-c="${c.id}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div></div>`).join('');
  b += `<div class="field"><span class="flabel">Noten</span><div class="avgbig">${av != null ? '⌀ ' + num1(av) : '–'}<small>${n ? `aus ${n} ${n === 1 ? 'Note' : 'Noten'}` : 'noch keine Noten'}</small></div>
    <div class="card plist">${activePersons().map(p => { const r = d.ratings[p.id], mine = p.id === ui.me;
      return `<div class="rrow">${dot(p)}<span class="pname">${esc(p.name)}${mine ? ' <span class="muted">(du)</span>' : ''}</span><div class="grades" role="group" aria-label="Note von ${esc(p.name)}" style="--c:${p.color}">${[1, 2, 3, 4, 5, 6].map(g => `<button class="gbtn ${r === g ? 'on' : ''}" ${mine ? `data-act="rate" data-id="${d.id}" data-n="${g}"` : 'disabled'} aria-pressed="${r === g}">${g}</button>`).join('')}</div></div>`; }).join('')}</div>
    <p class="help">1 = sehr gut, 6 = ungenügend. Du vergibst nur deine eigene Note und kannst sie jederzeit ändern. Nochmal antippen entfernt sie.</p></div>`;
  b += `<div class="field"><span class="flabel">Statistik</span><div class="stats"><span><b>${st ? st.n : 0}×</b>gekocht</span><span><b>${st ? fmtAuto(st.last) : '–'}</b>zuletzt</span></div></div>
    <div class="field"><span class="flabel">Entwicklung der Note</span>${spark(d.id, key)}</div>`;
  b += d.archived ? `<button class="btn ghost" data-act="dishRestore" data-id="${d.id}">Wiederherstellen</button>` : `<button class="btn ghost sm" data-act="dishArchive" data-id="${d.id}">Archivieren</button><p class="help">Archivierte Gerichte erscheinen nicht mehr in der Auswahl, bleiben aber im Rückblick erhalten.</p>`;
  return { title: d.name || (d.type === 'main' ? 'Neues Gericht' : 'Neues Dessert'), body: b };
}

function sheetClaim(a) {
  const it = (state.days[a.date]?.shop || []).find(s => s.id === a.id); if (!it) return { title: 'Einkauf', body: '' };
  const me = person(ui.me);
  return { title: `„${it.text}“`, body: `
    ${it.by ? `<p class="help">Aktuell: ${esc(pn(it.by))}, ${HOW[it.how]}.</p>` : '<p class="help">Wer besorgt das? Alle sehen deinen Namen am Eintrag.</p>'}
    <div class="list">
      <button class="drow" data-act="claimSet" data-how="bring">${dot(me)}<div class="dmain"><b>Bringe ich mit</b><small>z. B. aus dem Vorrat oder vom Markt</small></div></button>
      <button class="drow" data-act="claimSet" data-how="way">${dot(me)}<div class="dmain"><b>Besorge ich auf dem Heimweg</b><small>Erscheint mit deiner Farbe in der Liste</small></div></button>
      ${it.by ? `<button class="drow" data-act="claimClear">${ic('x')}<div class="dmain"><b>Übernahme aufheben</b></div></button>` : ''}
    </div>` };
}

function sheetWelcome(a) {
  return { title: a.switch ? 'Wer bist du?' : `Willkommen bei ${APP_NAME}`, closable: !!ui.me, body: `
    ${a.switch ? '' : `<div class="note"><b>${esc(state.family.name)}</b> · klickbarer Prototyp mit Beispieldaten. Alles, was du änderst, bleibt nur in diesem Browser.</div>`}
    <div class="field"><span class="flabel">Wer bist du auf diesem Gerät?</span><div class="list">
      ${activePersons().map(p => `<button class="drow" data-act="setMe" data-pid="${p.id}">${dot(p, 'lg')}<div class="dmain"><b>${esc(p.name)}</b><small>${p.admin ? 'Initiator' : 'Mitglied'}</small></div>${ui.me === p.id ? ic('check') : ''}</button>`).join('')}
      <button class="drow" data-act="newPerson">${ic('plus')}<div class="dmain"><b>Neue Person anlegen</b><small>Name und Farbe wählen</small></div></button>
    </div></div>
    <p class="help">Das Gerät merkt sich die Auswahl. Wechseln kannst du jederzeit oben rechts.</p>` };
}

function sheetPersons() {
  const arch = state.persons.filter(p => p.archived);
  return { title: 'Personen', body: `<div class="list">${activePersons().map(p => `<button class="drow" data-act="personEdit" data-id="${p.id}">${dot(p, 'lg')}<div class="dmain"><b>${esc(p.name)}</b><small>${p.admin ? 'Initiator' : 'Mitglied'}</small></div>${ic('right')}</button>`).join('')}
    <button class="drow newrow" data-act="newPerson">${ic('plus')}<div class="dmain"><b>Neue Person</b></div></button></div>
    ${arch.length ? `<div class="field"><span class="flabel">Archiviert</span><div class="list">${arch.map(p => `<div class="drow">${dot(p)}<div class="dmain"><b>${esc(p.name)}</b></div><button class="btn ghost sm" data-act="personRestore" data-id="${p.id}">Wiederherstellen</button></div>`).join('')}</div></div>` : ''}
    <p class="help">Personen sind Köche und Teilnehmer zugleich. Archivierte Personen bleiben im Rückblick sichtbar.</p>` };
}
function sheetPerson(a) {
  const p = person(a.id); if (!p) return { title: 'Person', body: '' };
  return { title: p.name || 'Neue Person', body: `
    <div class="field"><label for="person-name">Name</label><input class="inp" id="person-name" value="${esc(p.name)}" data-in="personName" data-id="${p.id}" placeholder="Vorname" autocomplete="off"></div>
    <div class="field"><span class="flabel">Figur</span><div class="figs">${[['f', 'Frau'], ['m', 'Mann'], ['n', 'neutral']].map(([v, l]) => `<button class="sw ${(p.fig || 'n') === v ? 'on' : ''}" data-act="figure" data-id="${p.id}" data-v="${v}" aria-pressed="${(p.fig || 'n') === v}"><span class="dot lg" style="--c:${p.color}">${figSvg(Object.assign({}, p, { fig: v }))}</span>${l}</button>`).join('')}</div></div>
    <div class="field"><span class="flabel">Farbe</span><div class="swatches">${COLORS.map(([n, c]) => { const used = activePersons().find(q => q.id !== p.id && q.color === c);
      return `<button class="sw ${p.color === c ? 'on' : ''}" data-act="color" data-id="${p.id}" data-c="${c}" style="--c:${c}" aria-pressed="${p.color === c}"><span class="c"></span>${n}${used ? `<small>auch ${esc(used.name)}</small>` : ''}</button>`; }).join('')}</div></div>
    <div class="field"><span class="flabel">Rolle</span><p class="help"><b>${p.admin ? 'Initiator' : 'Mitglied'}</b>. Rollen vergibt ein Initiator unter Menü → Verwaltung.</p></div>
    ${p.id !== ui.me && p.name ? `<button class="btn ghost sm" data-act="personArchive" data-id="${p.id}">Archivieren</button>` : ''}
    <button class="btn wide" data-act="close">Fertig</button>` };
}

function sheetCategories() {
  return { title: 'Kategorien', body: `${state.categories.map(c => `<div class="card plist">
      <input class="inp" value="${esc(c.name)}" data-in="catName" data-c="${c.id}" aria-label="Name der Kategorie" style="font-weight:700">
      <div class="chips">${c.values.map(v => `<span class="chip">${esc(v)}<button class="xbtn" data-act="catDelVal" data-c="${c.id}" data-v="${esc(v)}" aria-label="${esc(v)} entfernen">${ic('x')}</button></span>`).join('')}</div>
      <div class="addrow"><input class="inp" id="cat-new-${c.id}" placeholder="Neue Ausprägung" data-enter="catAddVal" data-c="${c.id}" autocomplete="off"><button class="btn ghost" data-act="catAddVal" data-c="${c.id}">Hinzufügen</button></div>
    </div>`).join('')}
    <button class="btn ghost" data-act="catAdd">${ic('plus')} Kategorie hinzufügen</button>
    <p class="help">Ein Gericht hat je Kategorie genau eine Ausprägung. Desserts haben keine Kategorien.</p>` };
}

function sheetReview() {
  const past = Object.keys(state.days).filter(dt => dt < TODAY && hasPlan(state.days[dt])).sort().reverse();
  const weeks = []; past.forEach(dt => { const w = mondayOf(dt); let g = weeks.find(x => x.w === w); if (!g) weeks.push(g = { w, days: [] }); g.days.push(dt); });
  return { title: 'Rückblick', body: `<p class="help">Antippen öffnet den Tag zur Korrektur.</p>
    ${weeks.map(g => `<div class="field"><span class="flabel">KW ${kw(g.w)} · ${fmtShort(g.w)} – ${fmtFull(addDays(g.w, 6))}</span><div class="list">${g.days.sort().map(dt => { const d = state.days[dt];
      return `<button class="drow" data-act="reviewDay" data-date="${dt}"><span class="rvd">${DOWS[wd(dt)]} ${fmtShort(dt)}</span>${KIND[d.kind].cook ? dot(person(d.cook)) : dot(null)}<div class="dmain"><b>${esc(dayWhat(dt, d))}</b><small>${KIND[d.kind].cook ? esc(pn(d.cook) || 'ohne Koch') : KIND[d.kind].l}${d.place === 'out' ? ' · auswärts' : ''}</small></div>${d.snap.dish != null ? `<span class="grade ${gcls(d.snap.dish)}">⌀ ${num1(d.snap.dish)}</span>` : ''}</button>`; }).join('')}</div></div>`).join('') || '<p class="help">Noch keine vergangenen Einträge.</p>'}` };
}

function sheetPlan() {
  const ws = [...Array(8)].map((_, i) => addDays(mondayOf(TODAY), i * 7));
  return { title: 'Planung', body: `<div class="list">${ws.map(w => { const n = [...Array(7)].filter((_, i) => hasPlan(state.days[addDays(w, i)])).length;

  const st = stats();
  if (a.file === 'tage') return csv([['Datum', 'Wochentag', 'Ort', 'Art', 'Koch', 'Uhrzeit', 'Gericht', 'Dessert', 'Teilnehmer', 'Gäste', 'Hinweise'],
    ...ds.map(dt => { const d = state.days[dt]; return [fmtFull(dt), DOW[wd(dt)], d.place === 'out' ? 'auswärts' : '@home', KIND[d.kind].l, pn(d.cook), d.time, dn(d.dish), dn(d.dessert), Object.entries(d.part).filter(([, v]) => v.s === 'yes').map(([k, v]) => pn(k) + (v.t ? ` (${v.t})` : '')).join(', '), d.guests, d.notes]; })]);
  if (a.file === 'gerichte') return csv([['Name', 'Typ', ...state.categories.map(c => c.name), 'Durchschnittsnote', 'Anzahl Noten', 'Häufigkeit', 'Zuletzt'],
    ...state.dishes.map(d => { const av = avgOf(d); return [d.name, d.type === 'main' ? 'Gericht' : 'Dessert', ...state.categories.map(c => d.cat?.[c.id] || ''), av != null ? num1(av) : '', Object.keys(d.ratings).length, st[d.id]?.n || 0, st[d.id] ? fmtFull(st[d.id].last) : '']; })]);
  if (a.file === 'noten') return csv([['Gericht', 'Person', 'Note'], ...state.dishes.flatMap(d => Object.entries(d.ratings).map(([p, n]) => [d.name, pn(p), n]))]);
  if (a.file === 'einkauf') return csv([['Datum', 'Eintrag', 'Erledigt', 'Übernommen von', 'Art'], ...ds.flatMap(dt => state.days[dt].shop.map(s => [fmtFull(dt), s.text, s.done ? 'ja' : 'nein', pn(s.by), s.how ? HOW[s.how] : '']))]);
  return csv([['Name', 'Farbe', 'Rolle', 'Archiviert'], ...state.persons.map(p => [p.name, (COLORS.find(c => c[1] === p.color) || [p.color])[0], p.admin ? 'Initiator' : 'Mitglied', p.archived ? 'ja' : 'nein'])]);
